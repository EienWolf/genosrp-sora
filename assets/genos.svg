<!-- Emblema del servidor de rol Genos, donde vive el personaje.
     Original limpio, con su degradado dorado. Sustituye a la vectorización
     por marching squares que se hizo desde una captura: aquella salía con el
     contorno mordido y las plumas partidas.
     Se usa como máscara CSS (.emblema-genos), así que del degradado solo
     cuenta la silueta; se conserva por si alguna vez se pinta tal cual. -->
